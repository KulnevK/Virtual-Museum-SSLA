<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виртуальный музей ФГБОУ ВО «СГЮА»</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>

<body>

<div id="home" class="home">
    <h1>
        <span class="home-title-main">Виртуальный музей</span>
        <span class="home-title-sub">ФГБОУ ВО «СГЮА»</span>
    </h1>
    <button class="start-btn" onclick="startTour()">Начать просмотр</button>
</div>

<button id="catalog-toggle" class="catalog-toggle hidden" type="button" onclick="toggleCatalog()">
    <span>&#9776;</span>
    <span>Экспонаты</span>
</button>

<button class="home-btn hidden" type="button" onclick="goHome()">Вернуться на главную</button>

<aside id="catalog-panel" class="catalog-panel">
    <h2>Каталог экспонатов</h2>
    <p>Откройте список, чтобы быстро перейти к нужному экспонату.</p>
    <input id="catalog-search" class="catalog-search" type="text" placeholder="Найти экспонат..." oninput="filterCatalog()">
    <div id="catalog-list" class="catalog-list"></div>
    <div id="catalog-empty" class="catalog-empty">По вашему запросу ничего не найдено.</div>
</aside>

<div id="catalog-overlay" class="catalog-overlay" onclick="closeCatalog()"></div>

<div class="wrapper" id="wrapper"></div>

<button class="nav-btn" id="prev-room">&#8592;</button>
<button class="nav-btn" id="next-room">&#8594;</button>

<div id="modal" class="modal">
    <div class="close" onclick="closeModal()">&#10005;</div>
    <div class="modal-content">
        <picture id="modal-picture" class="modal-picture">
            <source id="modal-img-webp" type="image/webp" srcset="">
            <img id="modal-img" alt="Изображение экспоната">
        </picture>
        <model-viewer id="modal-model" poster="assets/img/exhibits/bust.png" alt="3D-модель экспоната" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
        <div class="modal-text">
            <h2 id="modal-title"></h2>
            <p id="modal-desc"></p>
            <button type="button" class="modal-zoom-btn" onclick="openArtifactImageInNewTab()">Открыть изображение отдельно</button>
        </div>
    </div>
</div>

<script src="assets/js/museum-data.js" defer></script>
<script src="assets/js/app.js" defer></script>

</body>
</html>
